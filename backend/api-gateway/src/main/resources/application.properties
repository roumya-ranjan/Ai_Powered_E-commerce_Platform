spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

# ==================== PRODUCT SERVICE ====================
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webflux.routes[1].id=product-api-docs
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/product/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/product/(?<segment>.*), /$\{segment}

# ==================== AUTH SERVICE ====================
spring.cloud.gateway.server.webflux.routes[2].id=auth-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AUTH-SERVICE
