# ==================== SWAGGER AGGREGATION ====================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.urls[0].name=product-service
springdoc.swagger-ui.urls[0].url=/product/v3/api-docs
springdoc.swagger-ui.urls[1].name=auth-service
springdoc.swagger-ui.urls[1].url=/auth/v3/api-docs
springdoc.swagger-ui.urls[2].name=order-service
springdoc.swagger-ui.urls[2].url=/order/v3/api-docs
springdoc.swagger-ui.urls[3].name=payment-service
springdoc.swagger-ui.urls[3].url=/payment/v3/api-docs
springdoc.swagger-ui.urls[4].name=notification-service
springdoc.swagger-ui.urls[4].url=/notification/v3/api-docs